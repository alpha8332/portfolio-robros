<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" role="img" aria-labelledby="t d"><title id="t">장치별 연결 경로</title><desc id="d">SpaceMouse direct HID, Vive SteamVR bridge, Quest와 Pico OpenXR bridge를 거쳐 플랫폼 입력과 로봇 명령으로 연결된다.</desc><rect width="360" height="370" fill="#14191d"/><g font-family="Malgun Gothic,sans-serif" fill="#e0e8ed"><text x="24" y="30" font-size="11" fill="#9cb0be">DEVICE RUNTIME / OWNERSHIP</text><text x="24" y="64" font-size="11" fill="#9cb0be">HOST DEVICE</text><text x="195" y="64" font-size="11" fill="#9cb0be">입력 연결 방식</text><g fill="#1b242b" stroke="#415362"><rect x="24" y="80" width="312" height="49" rx="2"/><rect x="24" y="145" width="312" height="49" rx="2"/><rect x="24" y="210" width="312" height="49" rx="2"/></g><text x="38" y="111" font-size="14">SpaceMouse</text><text x="185" y="111" font-size="13" fill="#a9c5d7">→  direct HID</text><text x="38" y="176" font-size="14">Vive</text><text x="185" y="176" font-size="12" fill="#a9c5d7">→  SteamVR bridge</text><text x="38" y="241" font-size="14">Quest / Pico</text><text x="185" y="241" font-size="12" fill="#a9c5d7">→  OpenXR bridge</text><path d="M180 260V282m-4-4 4 4 4-4" stroke="#8aa9bb" fill="none"/><rect x="24" y="290" width="312" height="57" fill="#21303a" stroke="#7c9bad" rx="2"/><text x="39" y="313" font-size="13">CONTAINER / 장치 runtime</text><text x="39" y="334" font-size="12" fill="#b1c5d1">등록 · binding → 입력 → 로봇 명령 생성</text></g></svg>
