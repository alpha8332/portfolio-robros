<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">실로봇 Replay 실행 단계</title><desc id="desc">HDF5 episode를 읽은 뒤 초기 정렬과 안정 상태를 확인하고 본 재생을 시작한다. 초기 정렬은 재생 시간축과 구분된다.</desc>
<defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#7f9cad"/></marker></defs>
<rect width="600" height="360" fill="#14191d"/><g font-family="Inter,Malgun Gothic,sans-serif" fill="#dbe4ea"><text x="32" y="35" font-size="10" letter-spacing="1.6" fill="#8c979f">HDF5 EPISODE / ROBOT REPLAY</text><path d="M32 50H568M32 310H568" stroke="#253038"/>
<text x="49" y="86" font-size="9" letter-spacing="1.3" fill="#8c979f">PREPARATION</text><text x="420" y="86" font-size="9" letter-spacing="1.3" fill="#9cc4dc">EXECUTION</text>
<rect x="48" y="105" width="132" height="82" fill="#1b242b" stroke="#415362" rx="2"/><text x="64" y="130" font-size="9" fill="#8c979f">SOURCE</text><text x="64" y="154" font-size="15">HDF5 Episode</text><text x="64" y="173" font-size="10" fill="#9cb0be">관절 · 자세 · 엔드이펙터</text><path d="M181 146H210" stroke="#7f9cad" marker-end="url(#a)"/>
<rect x="215" y="105" width="155" height="82" fill="#1b242b" stroke="#415362" rx="2"/><text x="231" y="130" font-size="9" fill="#8c979f">ALIGNING</text><text x="231" y="154" font-size="15">초기 자세 정렬</text><text x="231" y="173" font-size="10" fill="#9cb0be">목표 유지 · 도달 확인</text><path d="M371 146H412" stroke="#7f9cad" marker-end="url(#a)"/>
<path d="M394 66V293" stroke="#415362" stroke-dasharray="3 5"/>
<rect x="418" y="105" width="134" height="82" fill="#21303a" stroke="#7c9bad" rx="2"/><text x="434" y="130" font-size="9" fill="#9cc4dc">RUNNING</text><text x="434" y="154" font-size="15">본 Replay</text><text x="434" y="173" font-size="10" fill="#9cb0be">팔 + 엔드이펙터</text>
<path d="M292 188V211H237V239H292V222" fill="none" stroke="#7f9cad" marker-end="url(#a)"/><text x="310" y="226" font-size="11" fill="#9cb0be">pulse / hold</text><text x="48" y="277" font-size="11" fill="#8c979f">정렬 중에는 재생 진행률 고정</text><text x="418" y="277" font-size="11" fill="#9cc4dc">기록된 시간축으로 실행</text><text x="32" y="335" font-size="10" fill="#8c979f">초기 위치 도달과 안정 확인 후 재생 시작</text></g></svg>
