<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" role="img" aria-labelledby="t d"><title id="t">초기 정렬과 Replay 실행</title><desc id="d">기록 데이터를 읽고 초기 목표를 유지해 도달과 안정을 확인한 다음 Replay를 시작한다.</desc><defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#8aa9bb"/></marker></defs><rect width="360" height="365" fill="#14191d"/><g font-family="Malgun Gothic,sans-serif" fill="#e0e8ed"><text x="24" y="30" font-size="11" fill="#9cb0be">HDF5 EPISODE / ROBOT REPLAY</text><rect x="24" y="55" width="312" height="61" fill="#1b242b" stroke="#415362" rx="2"/><text x="40" y="81" font-size="15">HDF5 Episode</text><text x="40" y="102" font-size="12" fill="#9cb0be">관절 · 자세 · 엔드이펙터 데이터</text><path d="M180 117V139" stroke="#8aa9bb" marker-end="url(#a)"/><rect x="24" y="146" width="312" height="76" fill="#1b242b" stroke="#415362" rx="2"/><text x="40" y="173" font-size="15">초기 자세 정렬</text><text x="40" y="198" font-size="12" fill="#9cb0be">목표 유지 · 재전송 → 도달 · 안정 확인</text><path d="M180 223V250" stroke="#8aa9bb" marker-end="url(#a)"/><rect x="24" y="257" width="312" height="72" fill="#21303a" stroke="#7c9bad" rx="2"/><text x="40" y="284" font-size="15">본 Replay 시작</text><text x="40" y="309" font-size="12" fill="#b1c5d1">기록된 시간축으로 팔 + 엔드이펙터 실행</text><text x="24" y="351" font-size="11" fill="#9cb0be">정렬 단계와 본 재생의 시간축을 구분</text></g></svg>
