<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">장치별 Host와 Container 연결 경로</title><desc id="desc">SpaceMouse는 HID 직접 접근, Vive는 SteamVR 브리지, Quest·Pico는 OpenXR 브리지로 컨테이너의 장치 런타임에 연결된다.</desc>
<defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#7f9cad"/></marker></defs>
<rect width="600" height="360" fill="#14191d"/><g font-family="Inter,Malgun Gothic,sans-serif" fill="#dbe4ea"><text x="32" y="35" font-size="10" letter-spacing="1.6" fill="#8c979f">DEVICE RUNTIME / OWNERSHIP</text><path d="M32 50H568M32 310H568" stroke="#253038"/><text x="49" y="83" font-size="9" letter-spacing="1.3" fill="#8c979f">HOST</text><text x="428" y="83" font-size="9" letter-spacing="1.3" fill="#9cc4dc">CONTAINER</text><path d="M393 68V293" stroke="#415362" stroke-dasharray="3 5"/>
<g fill="#1b242b" stroke="#415362"><rect x="48" y="100" width="133" height="44" rx="2"/><rect x="48" y="167" width="133" height="44" rx="2"/><rect x="48" y="234" width="133" height="44" rx="2"/></g>
<text x="64" y="128" font-size="14">SpaceMouse</text><text x="64" y="195" font-size="14">Vive</text><text x="64" y="262" font-size="14">Quest / Pico</text>
<text x="222" y="114" font-size="11" fill="#9cb0be">direct HID</text><path d="M182 128H421" stroke="#7f9cad" marker-end="url(#a)"/>
<path d="M182 189H213" stroke="#7f9cad" marker-end="url(#a)"/><rect x="219" y="169" width="148" height="40" fill="#21303a" stroke="#607f92" rx="2"/><text x="233" y="194" font-size="12">SteamVR bridge</text><path d="M368 189H421" stroke="#7f9cad" marker-end="url(#a)"/>
<path d="M182 256H213" stroke="#7f9cad" marker-end="url(#a)"/><rect x="219" y="236" width="148" height="40" fill="#21303a" stroke="#607f92" rx="2"/><text x="233" y="261" font-size="12">OpenXR bridge</text><path d="M368 256H421" stroke="#7f9cad" marker-end="url(#a)"/>
<rect x="427" y="100" width="125" height="178" fill="#1b242b" stroke="#7c9bad" rx="2"/><text x="444" y="143" font-size="9" fill="#9cc4dc">DEVICE INPUT</text><text x="444" y="171" font-size="14">장치 runtime</text><path d="M443 191H535" stroke="#415362"/><text x="444" y="218" font-size="11" fill="#9cb0be">등록 · binding</text><text x="444" y="240" font-size="11" fill="#9cb0be">로봇 명령 생성</text><text x="32" y="335" font-size="10" fill="#8c979f">장치 특성에 맞춰 직접 접근과 호스트 브리지를 분리</text></g></svg>
