<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">설치 간격을 제거하고 양팔 움직임 비교</title><desc id="desc">서로 다른 시작 위치의 두 팔이 같은 원형 운동을 하는 시험 개념도. 실제 측정 궤적이 아닙니다.</desc><rect width="760" height="330" fill="#14191d"/><g font-family="Malgun Gothic,sans-serif"><text x="26" y="36" fill="#f0f1f2" font-size="21">설치 간격을 뺀 뒤, 움직임만 비교</text><g fill="none" stroke="#9cc4dc" stroke-width="2"><circle cx="205" cy="174" r="80"/><circle cx="550" cy="174" r="80"/></g><g stroke="#30373d"><path d="M100 174H310M205 75V275M445 174H655M550 75V275"/></g><g fill="#EA580C"><circle cx="261" cy="117" r="7"/><circle cx="606" cy="117" r="7"/></g><path d="M270 117H597" stroke="#EA580C" stroke-dasharray="5 6"/><rect x="316" y="95" width="230" height="40" fill="#14191d"/><text x="330" y="119" fill="#f29a69" font-size="15">대응하는 움직임을 비교</text><text x="165" y="292" fill="#b0b8be" font-size="16">왼팔</text><text x="520" y="292" fill="#b0b8be" font-size="16">오른팔</text><text x="26" y="320" fill="#8c979f" font-size="12">시험 구성 개념도 · 실제 측정 궤적 아님</text></g></svg>