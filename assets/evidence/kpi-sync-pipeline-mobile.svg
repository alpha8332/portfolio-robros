<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 790" role="img" aria-labelledby="title"><title id="title">두 팔이 함께 움직였는지 확인하기</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cc4dc" stroke-width="1.4"/></marker></defs><rect width="420" height="790" fill="#14191d"/><g font-family="Malgun Gothic,Pretendard,sans-serif"><text x="24" y="40" font-size="23" fill="#f0f1f2" text-anchor="start">두 팔이 함께 움직였는지 확인하기</text><text x="24" y="70" font-size="14" fill="#8c979f" text-anchor="start">문제 해결 과정을 요약한 개념도</text><rect x="30" y="100" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="128" font-size="13" fill="#9cc4dc" text-anchor="start">01</text><text x="48" y="161" font-size="21" fill="#f0f1f2" text-anchor="start">같은 궤적 입력</text><text x="48" y="191" font-size="15" fill="#b0b8be" text-anchor="start">두 팔에 같은</text><text x="48" y="216" font-size="15" fill="#b0b8be" text-anchor="start">원형 움직임을 요청</text><path d="M210 231L210 250" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="255" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="283" font-size="13" fill="#9cc4dc" text-anchor="start">02</text><text x="48" y="316" font-size="21" fill="#f0f1f2" text-anchor="start">실제 위치 기록</text><text x="48" y="346" font-size="15" fill="#b0b8be" text-anchor="start">목표값과 구분해</text><text x="48" y="371" font-size="15" fill="#b0b8be" text-anchor="start">양팔 움직임을 기록</text><path d="M210 386L210 405" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="410" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="438" font-size="13" fill="#9cc4dc" text-anchor="start">03</text><text x="48" y="471" font-size="21" fill="#f0f1f2" text-anchor="start">시작 차이만 제거</text><text x="48" y="501" font-size="15" fill="#b0b8be" text-anchor="start">설치 간격에 해당하는</text><text x="48" y="526" font-size="15" fill="#b0b8be" text-anchor="start">초기 위치 차이를 뺌</text><path d="M210 541L210 560" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="565" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="593" font-size="13" fill="#9cc4dc" text-anchor="start">04</text><text x="48" y="626" font-size="21" fill="#f0f1f2" text-anchor="start">움직임 차이 비교</text><text x="48" y="656" font-size="15" fill="#b0b8be" text-anchor="start">이후 두 팔의 차이로</text><text x="48" y="681" font-size="15" fill="#b0b8be" text-anchor="start">동기 오차를 판단</text><text x="24" y="755" font-size="15" fill="#9cc4dc" text-anchor="start">각 팔의 목표 추종과 양팔 동기는 따로 확인합니다.</text></g></svg>