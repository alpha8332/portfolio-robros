<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 890" role="img" aria-labelledby="title"><title id="title">데이터의 소속을 끝까지 유지하기</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cc4dc" stroke-width="1.4"/></marker></defs><rect width="420" height="890" fill="#14191d"/><g font-family="Malgun Gothic,Pretendard,sans-serif"><text x="24" y="40" font-size="23" fill="#f0f1f2" text-anchor="start">데이터의 소속을 끝까지 유지하기</text><text x="24" y="70" font-size="14" fill="#8c979f" text-anchor="start">문제 해결 과정을 요약한 개념도</text><rect x="30" y="100" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="128" font-size="13" fill="#9cc4dc" text-anchor="start">01</text><text x="48" y="161" font-size="21" fill="#f0f1f2" text-anchor="start">로봇별로 수집</text><text x="48" y="191" font-size="15" fill="#b0b8be" text-anchor="start">각 로봇의 데이터를</text><text x="48" y="216" font-size="15" fill="#b0b8be" text-anchor="start">각자 구분해서 기록</text><path d="M210 231L210 250" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="255" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="283" font-size="13" fill="#9cc4dc" text-anchor="start">02</text><text x="48" y="316" font-size="21" fill="#f0f1f2" text-anchor="start">순서도 함께 저장</text><text x="48" y="346" font-size="15" fill="#b0b8be" text-anchor="start">누구의 값인지와</text><text x="48" y="371" font-size="15" fill="#b0b8be" text-anchor="start">결합 순서를 남김</text><path d="M210 386L210 405" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="410" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="438" font-size="13" fill="#9cc4dc" text-anchor="start">03</text><text x="48" y="471" font-size="21" fill="#f0f1f2" text-anchor="start">같은 기준으로 분리</text><text x="48" y="501" font-size="15" fill="#b0b8be" text-anchor="start">저장한 순서·차원대로</text><text x="48" y="526" font-size="15" fill="#b0b8be" text-anchor="start">예측 출력을 나눔</text><path d="M210 541L210 560" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="565" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="593" font-size="13" fill="#9cc4dc" text-anchor="start">04</text><text x="48" y="626" font-size="21" fill="#f0f1f2" text-anchor="start">각 로봇으로 전달</text><text x="48" y="656" font-size="15" fill="#b0b8be" text-anchor="start">소속 로봇을 찾아</text><text x="48" y="681" font-size="15" fill="#b0b8be" text-anchor="start">해당 명령을 전달</text><text x="24" y="755" font-size="15" fill="#9cc4dc" text-anchor="start">배열 크기가 같아도, 로봇의 소속은 다릅니다.</text></g><g font-family="Malgun Gothic,Pretendard,sans-serif"><rect x="24" y="795" width="372" height="78" rx="5" fill="#1b2932" stroke="#415362"/><text x="40" y="825" font-size="18" fill="#9cc4dc">N대 확장을 고려한 설계</text><text x="40" y="852" font-size="14" fill="#b0b8be">로봇별 식별자·순서·차원 유지</text></g></svg>