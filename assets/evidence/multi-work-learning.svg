<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title"><title id="title">데이터의 소속을 끝까지 유지하기</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cc4dc" stroke-width="1.4"/></marker></defs><rect width="960" height="460" fill="#14191d"/><g font-family="Malgun Gothic,Pretendard,sans-serif"><text x="24" y="40" font-size="23" fill="#f0f1f2" text-anchor="start">데이터의 소속을 끝까지 유지하기</text><text x="24" y="70" font-size="14" fill="#8c979f" text-anchor="start">문제 해결 과정을 요약한 개념도</text><rect x="24" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="42" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">01</text><text x="42" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">로봇별로 수집</text><text x="42" y="196" font-size="15" fill="#b0b8be" text-anchor="start">A와 B의 데이터를</text><text x="42" y="221" font-size="15" fill="#b0b8be" text-anchor="start">각자 구분해서 기록</text><path d="M237 180L255 180" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="258" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="276" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">02</text><text x="276" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">순서도 함께 저장</text><text x="276" y="196" font-size="15" fill="#b0b8be" text-anchor="start">누구의 값인지와</text><text x="276" y="221" font-size="15" fill="#b0b8be" text-anchor="start">결합 순서를 남김</text><path d="M471 180L489 180" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="492" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="510" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">03</text><text x="510" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">같은 기준으로 분리</text><text x="510" y="196" font-size="15" fill="#b0b8be" text-anchor="start">학습 때의 순서대로</text><text x="510" y="221" font-size="15" fill="#b0b8be" text-anchor="start">예측 출력을 나눔</text><path d="M705 180L723 180" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="726" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="744" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">04</text><text x="744" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">각 로봇으로 전달</text><text x="744" y="196" font-size="15" fill="#b0b8be" text-anchor="start">A의 값은 A에게</text><text x="744" y="221" font-size="15" fill="#b0b8be" text-anchor="start">B의 값은 B에게</text><text x="24" y="325" font-size="15" fill="#9cc4dc" text-anchor="start">배열 크기가 같아도, 로봇의 소속은 다릅니다.</text></g><g font-family="Malgun Gothic,Pretendard,sans-serif"><rect x="24" y="365" width="912" height="78" rx="5" fill="#1b2932" stroke="#415362"/><text x="40" y="395" font-size="23" fill="#9cc4dc">로봇 2대의 데이터와 출력 소속 유지</text><text x="40" y="422" font-size="17" fill="#b0b8be">임의 N대 확장 성능을 뜻하지 않음</text></g></svg>