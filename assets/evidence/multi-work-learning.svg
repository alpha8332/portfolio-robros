<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1030" width="1180" height="1030" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Learning / explicit key order, units and owner-local action reconstruction</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Learning / explicit key order, units and owner-local action reconstruction</text><rect x="30" y="75" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw owner A</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q / qdot [deg, deg/s]</text><text x="44" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p [mm] + Euler [deg]</text><text x="44" y="169" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand joint_pos_deg retains its explicit units</text><rect x="620" y="75" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw owner B</text><text x="634" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same field shape does not imply same owner</text><text x="634" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Own current pose / command history</text><text x="634" y="169" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared images remain camera-keyed</text><path d="M295 180V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 180V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="250" width="1120" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical adapter / robot key retained</text><text x="44" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q/qdot → rad/rad·s⁻¹ | position → m | Euler → rotation matrix</text><text x="44" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">observation.robot.&lt;key&gt;.* and action.robot.&lt;key&gt;.*</text><text x="44" y="344" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Previous grasp context is shifted within the owning robot; first row copies its first command</text><path d="M590 360V405H295V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 405H885V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="430" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input contract</text><text x="44" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected key list + shapes + normalizers</text><text x="44" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Concatenate known blocks; owner survives in schema</text><rect x="620" y="430" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Output contract</text><text x="634" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected action key list + shapes</text><text x="634" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No universal fixed multi-robot output width</text><path d="M295 530V600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 530V600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="600" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="626" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training provider → checkpoint / model contract</text><text x="44" y="652" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Weights alone do not define execution. Persist IO + robot keys + robot map + EE contract.</text><text x="44" y="673" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing ACT / DP representations belong to their providers, not to a mechanical DOF count.</text><path d="M590 700V740H295V770" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 740H885V770" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="770" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="796" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Decode owner A</text><text x="44" y="822" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Split by selected output key + width</text><text x="44" y="843" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p* = p_A + R_A Δp_A</text><text x="44" y="864" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R* = R_A ΔR_A</text><rect x="620" y="770" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="796" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Decode owner B</text><text x="634" y="822" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Split by selected output key + width</text><text x="634" y="843" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p* = p_B + R_B Δp_B</text><text x="634" y="864" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R* = R_B ΔR_B</text><text x="30" y="955" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reconstruct with each robot’s own base pose. No inter-robot world calibration or zero tracking-error result is implied.</text></svg>