<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" role="img" aria-labelledby="title"><title id="title">원문부터 화면까지 정책의 의미를 같은 기준으로 유지</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9dbed1" stroke-width="1.5"/></marker><marker id="alert" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#EA580C" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="7" fill="#151a1e"/><g font-family="Noto Sans KR,Malgun Gothic,sans-serif"><text x="210.0" y="36" font-size="22" fill="#a4c8df" text-anchor="middle">원문부터 화면까지, 같은 의미로</text><rect x="24" y="75" width="372" height="125" rx="7" fill="#1b2228" stroke="#46535e" stroke-width="1.5"/><text x="42" y="100" font-size="13" fill="#9dbed1" text-anchor="start">01</text><text x="210.0" y="127" font-size="20" fill="#eef3f6" text-anchor="middle">원문과 근거</text><text x="210.0" y="157" font-size="17" fill="#a4c8df" text-anchor="middle">기관별 정책 정보</text><text x="210.0" y="182" font-size="17" fill="#a4c8df" text-anchor="middle">지역·연령·기간</text><path d="M210.0 203 L210.0 222" fill="none" stroke="#9dbed1" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="230" width="372" height="125" rx="7" fill="#1b2228" stroke="#EA580C" stroke-width="1.5"/><text x="42" y="255" font-size="13" fill="#9dbed1" text-anchor="start">02</text><text x="210.0" y="282" font-size="20" fill="#eef3f6" text-anchor="middle">공통 스키마</text><text x="210.0" y="312" font-size="17" fill="#a4c8df" text-anchor="middle">필드·값 의미 통일</text><text x="210.0" y="337" font-size="17" fill="#a4c8df" text-anchor="middle">출처 정보 연결</text><path d="M210.0 358 L210.0 377" fill="none" stroke="#9dbed1" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="385" width="372" height="125" rx="7" fill="#1b2228" stroke="#EA580C" stroke-width="1.5"/><text x="42" y="410" font-size="13" fill="#9dbed1" text-anchor="start">03</text><text x="210.0" y="437" font-size="20" fill="#eef3f6" text-anchor="middle">품질 확인</text><text x="210.0" y="467" font-size="17" fill="#a4c8df" text-anchor="middle">중복·결측 검수</text><text x="210.0" y="492" font-size="17" fill="#a4c8df" text-anchor="middle">확인 필요 상태 분리</text><path d="M210.0 513 L210.0 532" fill="none" stroke="#9dbed1" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="540" width="372" height="125" rx="7" fill="#1b2228" stroke="#46535e" stroke-width="1.5"/><text x="42" y="565" font-size="13" fill="#9dbed1" text-anchor="start">04</text><text x="210.0" y="592" font-size="20" fill="#eef3f6" text-anchor="middle">사용자에게 전달</text><text x="210.0" y="622" font-size="17" fill="#a4c8df" text-anchor="middle">PostgreSQL → API</text><text x="210.0" y="647" font-size="17" fill="#a4c8df" text-anchor="middle">검색·추천 화면</text><text x="210.0" y="729" font-size="15" fill="#a4c8df" text-anchor="middle">공통 스키마·검수 기준을 연결한 처리 흐름</text></g></svg>