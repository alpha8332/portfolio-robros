<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 790" role="img" aria-labelledby="title"><title id="title">얼마나 늦게 따라왔는지 확인하기</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cc4dc" stroke-width="1.4"/></marker></defs><rect width="420" height="790" fill="#14191d"/><g font-family="Malgun Gothic,Pretendard,sans-serif"><text x="24" y="40" font-size="23" fill="#f0f1f2" text-anchor="start">얼마나 늦게 따라왔는지 확인하기</text><text x="24" y="70" font-size="14" fill="#8c979f" text-anchor="start">문제 해결 과정을 요약한 개념도</text><rect x="30" y="100" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="128" font-size="13" fill="#9cc4dc" text-anchor="start">01</text><text x="48" y="161" font-size="21" fill="#f0f1f2" text-anchor="start">실제 움직임 관찰</text><text x="48" y="191" font-size="15" fill="#b0b8be" text-anchor="start">먼저 움직인 팔과</text><text x="48" y="216" font-size="15" fill="#b0b8be" text-anchor="start">따라오는 팔을 기록</text><path d="M210 231L210 250" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="255" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="283" font-size="13" fill="#9cc4dc" text-anchor="start">02</text><text x="48" y="316" font-size="21" fill="#f0f1f2" text-anchor="start">같은 지점 찾기</text><text x="48" y="346" font-size="15" fill="#b0b8be" text-anchor="start">원궤적의 같은 위상을</text><text x="48" y="371" font-size="15" fill="#b0b8be" text-anchor="start">두 팔에서 대응시킴</text><path d="M210 386L210 405" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="410" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="438" font-size="13" fill="#9cc4dc" text-anchor="start">03</text><text x="48" y="471" font-size="21" fill="#f0f1f2" text-anchor="start">통과 시각 비교</text><text x="48" y="501" font-size="15" fill="#b0b8be" text-anchor="start">두 팔이 그 지점을</text><text x="48" y="526" font-size="15" fill="#b0b8be" text-anchor="start">언제 지났는지 비교</text><path d="M210 541L210 560" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="565" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="593" font-size="13" fill="#9cc4dc" text-anchor="start">04</text><text x="48" y="626" font-size="21" fill="#f0f1f2" text-anchor="start">반복 결과 판단</text><text x="48" y="656" font-size="15" fill="#b0b8be" text-anchor="start">20회 평균과</text><text x="48" y="681" font-size="15" fill="#b0b8be" text-anchor="start">기준 초과를 함께 확인</text><text x="24" y="746" font-size="14" fill="#9cc4dc">전송 시간 대신 실제 운동을 비교합니다. 실측</text><text x="24" y="768" font-size="14" fill="#9cc4dc">파형은 아닙니다.</text></g></svg>