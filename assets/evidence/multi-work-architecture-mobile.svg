<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 820" role="img" aria-labelledby="title"><title id="title">화면 선택과 작업 참여의 변경 전후</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cc4dc" stroke-width="1.4"/></marker></defs><rect width="420" height="820" fill="#14191d"/><g font-family="Malgun Gothic,Pretendard,sans-serif"><text x="24" y="40" font-size="23" fill="#f0f1f2" text-anchor="start">화면 선택과 작업 참여를 나누기</text><text x="24" y="85" font-size="18" fill="#EA580C" text-anchor="start">변경 전: 선택한 한 대가 기준</text><rect x="30" y="103" width="360" height="65" rx="5" fill="#191e22" stroke="#415362"/><text x="46" y="130" font-size="18" fill="#f0f1f2" text-anchor="start">화면 선택</text><text x="46" y="153" font-size="14" fill="#b0b8be" text-anchor="start">로봇 A를 보고 있음</text><path d="M210 169L210 181" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="183" width="360" height="65" rx="5" fill="#191e22" stroke="#415362"/><text x="46" y="210" font-size="18" fill="#f0f1f2" text-anchor="start">수집·전환·정지</text><text x="46" y="233" font-size="14" fill="#b0b8be" text-anchor="start">A만 대상으로 처리</text><path d="M210 249L210 261" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="263" width="360" height="65" rx="5" fill="#191e22" stroke="#415362"/><text x="46" y="290" font-size="18" fill="#f0f1f2" text-anchor="start">남은 문제</text><text x="46" y="313" font-size="14" fill="#b0b8be" text-anchor="start">B는 세션 작업에서 빠짐</text><text x="24" y="385" font-size="18" fill="#EA580C" text-anchor="start">변경 후: 세션 참가자가 기준</text><rect x="30" y="403" width="360" height="65" rx="5" fill="#191e22" stroke="#415362"/><text x="46" y="430" font-size="18" fill="#f0f1f2" text-anchor="start">화면 선택</text><text x="46" y="453" font-size="14" fill="#b0b8be" text-anchor="start">관찰할 로봇만 변경</text><path d="M210 469L210 481" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="483" width="360" height="65" rx="5" fill="#191e22" stroke="#EA580C"/><text x="46" y="510" font-size="18" fill="#f0f1f2" text-anchor="start">작업 참가자 A + B</text><text x="46" y="533" font-size="14" fill="#b0b8be" text-anchor="start">전환·정지는 세션 전체</text><path d="M210 549L210 561" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="563" width="360" height="65" rx="5" fill="#191e22" stroke="#415362"/><text x="46" y="590" font-size="18" fill="#f0f1f2" text-anchor="start">로봇별 실행</text><text x="46" y="613" font-size="14" fill="#b0b8be" text-anchor="start">각 제어기·장치로 전달</text><text x="24" y="695" font-size="15" fill="#9cc4dc" text-anchor="start">화면은 한 대를 보더라도, 작업 대상은 두 대입니다.</text></g><g font-family="Malgun Gothic,Pretendard,sans-serif"><rect x="24" y="725" width="372" height="78" rx="5" fill="#1b2932" stroke="#415362"/><text x="40" y="755" font-size="18" fill="#9cc4dc">독립 로봇 2대 · 제어기 2개</text><text x="40" y="782" font-size="14" fill="#b0b8be">화면 선택과 세션 참여를 분리</text></g></svg>