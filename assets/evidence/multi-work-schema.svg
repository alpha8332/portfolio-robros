<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 970" width="1180" height="970" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Raw data / a shared episode with explicit per-robot namespaces</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw data / a shared episode with explicit per-robot namespaces</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One v5 episode / illustrative robot_a and robot_b</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Frozen session contract: participant ids + robot_order + primary + id→key + ordered robots + EE ownership</text><rect x="30" y="220" width="1120" height="160" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="245" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SHARED SESSION STREAMS</text><rect x="50" y="270" width="510" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">timestamps / timestamps.utc</text><text x="64" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Application sample monotonic / UTC clock</text><rect x="610" y="270" width="520" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">camera.&lt;name&gt;.* + metadata.video_files</text><text x="624" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Frame time / validity + MP4 sidecar reference</text><rect x="30" y="435" width="530" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="460" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.robot_a.* / owner namespace</text><rect x="50" y="485" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="511" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured state</text><text x="64" y="537" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">proprio.q / qdot / arm.p</text><text x="64" y="558" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand.feedback.* / per-device timing + validity</text><rect x="50" y="605" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Issued targets / command intent</text><text x="64" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">control.arm.teleop_command / control.gripper.*</text><text x="64" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand.command.joint_pos_deg / grasp state, mode, force</text><path d="M295 380V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="620" y="435" width="530" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="460" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.robot_b.* / owner namespace</text><rect x="640" y="485" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="511" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured state</text><text x="654" y="537" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">proprio.q / qdot / arm.p</text><text x="654" y="558" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand.feedback.* / per-device timing + validity</text><rect x="640" y="605" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Issued targets / command intent</text><text x="654" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">control.arm.teleop_command / control.gripper.*</text><text x="654" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand.command.joint_pos_deg / grasp state, mode, force</text><path d="M885 380V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="805" width="1120" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="831" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Compatibility and missing-value semantics</text><text x="44" y="857" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Single robot v4 / side-qualified dual-arm remain supported. New sessions add v5; old artifacts are not rewritten.</text><text x="44" y="878" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Default rows preserve required schema, but zero-filled fields are not evidence of a real issued target.</text><text x="44" y="899" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw id→key map and model key→contract map have different shapes; inspect the stage contract.</text></svg>