<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Identity / participant set, stable order and UI focus are separate contracts</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Identity / participant set, stable order and UI focus are separate contracts</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session: participants {A, B} / order [B, A] / primary A</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A and B are independent single-arm robots; labels below are illustrative, not physical installation identifiers</text><path d="M300 160V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 160V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="235" width="530" height="330" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="260" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT A / own controller</text><rect x="50" y="285" width="490" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime target A → storage key robot_a</text><text x="64" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">model Indy12 / segment arm / owned Hand A</text><rect x="50" y="425" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.robot_a.*</text><text x="64" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q / qdot / pose / target / hand state + commands</text><text x="64" y="498" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Namespace remains A even when UI focuses on B</text><path d="M295 365V425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="620" y="235" width="530" height="330" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="260" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT B / own controller</text><rect x="640" y="285" width="490" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime target B → storage key robot_b</text><text x="654" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">model Indy12 / segment arm / owned Hand B</text><rect x="640" y="425" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.robot_b.*</text><text x="654" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q / qdot / pose / target / hand state + commands</text><text x="654" y="498" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No implicit physical left / right assignment</text><path d="M885 365V425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="650" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical order [B, A]</text><text x="44" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Serialization order can place B first.</text><text x="44" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit keys still identify each block owner.</text><text x="44" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Equal-width blocks are not interchangeable.</text><rect x="620" y="650" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Focus A → B</text><text x="634" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Changes a single-focus control surface.</text><text x="634" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Does not remove A from recording participants.</text><text x="634" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Deleting A requires session-reference repair.</text><path d="M295 565V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 565V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>