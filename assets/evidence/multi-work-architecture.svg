<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1190" width="1240" height="1190" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Multi-robot pipeline / ownership survives capture, model artifacts and execution</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Multi-robot pipeline / ownership survives capture, model artifacts and execution</text><rect x="30" y="70" width="1180" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser / Session Setup · Move Robot · Collect · Train · Deploy · Inspect</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Edit intent + render status. Focus selection is not the session participant set; backend resolves compatibility.</text><path d="M300 155V215" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="315" y="193" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">intent through gateway</text><rect x="30" y="215" width="550" height="665" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="240" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DEVICE / CONFIGURATION + CAPTURE OWNER</text><rect x="50" y="265" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="291" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session normalization + runtime registry</text><text x="64" y="317" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">participants / order / primary / id→key / owned EE</text><rect x="50" y="405" width="235" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot A worker</text><text x="64" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller A + EE A</text><text x="64" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Readback / targets</text><text x="64" y="499" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Own frame and timestamps</text><rect x="325" y="405" width="235" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot B worker</text><text x="339" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller B + EE B</text><text x="339" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Readback / targets</text><text x="339" y="499" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Own frame and timestamps</text><path d="M190 350V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M440 350V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="580" width="510" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One capture sample builder</text><text x="64" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read each participant snapshot in one application tick</text><text x="64" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve device time / validity; not simultaneous sensing</text><path d="M170 505V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M440 505V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="755" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="781" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw episode + frozen session metadata</text><text x="64" y="807" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">v5 robot.&lt;key&gt;.* + shared camera / MP4 references</text><path d="M305 680V755" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="640" y="215" width="570" height="665" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="652" y="240" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DATA PROCESSING / ARTIFACT CONTRACT</text><rect x="660" y="265" width="530" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="291" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw → canonical adapter</text><text x="674" y="317" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-owner observation / action / previous command</text><text x="674" y="338" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Units + rotations + selected key order</text><rect x="660" y="440" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training pipeline / provider</text><text x="674" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Concatenate selected inputs / outputs with key + shape</text><text x="674" y="513" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT / DP implementation reused, not new algorithms</text><path d="M925 360V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="660" y="615" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="641" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preprocess + run + checkpoint metadata</text><text x="674" y="667" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_keys / model + joint dimensions / ee_contract</text><text x="674" y="688" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">IO schema / normalizers / model execution contract</text><path d="M925 540V615" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="660" y="775" width="530" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Visualization / raw-source inspection</text><text x="674" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot-aware graph + table; RGB loaded separately</text><path d="M560 795H610V310H660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="585" y="580" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">raw</text><path d="M610 810H660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="950" width="550" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="976" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live model execution branch</text><text x="44" y="1002" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compatibility gate: artifact ↔ current session</text><text x="44" y="1023" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Live A/B observation → model → owner-keyed decode</text><text x="44" y="1044" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Command resolves exact robot worker + attachment</text><rect x="640" y="950" width="570" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="976" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded Replay branch / no learned policy</text><text x="654" y="1002" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw source → parallel initial alignment → all-ready barrier</text><text x="654" y="1023" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One source clock → A/B arm + end-effector dispatch</text><text x="654" y="1044" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-robot status + session cleanup</text><path d="M925 715H1225V920H305V950" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="850" y="912" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">model artifact</text><path d="M560 820H610V1015H640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="612" y="901" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">raw source</text><path d="M305 950H15V455H50" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="915" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">owner A commands</text><path d="M500 950V900H595V455H560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="385" y="893" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">owner B commands</text><text x="30" y="1140" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical independence is preserved; session-level coordination does not establish controller-level simultaneous execution.</text></svg>