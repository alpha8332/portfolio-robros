<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Pick and place / observation, grasp and destination</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Pick and place / observation, grasp and destination</text><rect x="25" y="70" width="1130" height="520" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONCEPTUAL WORK AREA / not a measured drawing or installation photograph</text><rect x="55" y="115" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Fixed observation arm</text><text x="69" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Wrist view includes object + tray</text><text x="69" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera mounting is part of setup</text><rect x="795" y="115" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Manipulating arm</text><text x="809" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Approach / central grasp</text><text x="809" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Carry / release / return</text><rect x="210" y="300" width="760" height="225" rx="6" fill="#18232a" stroke="#47606e"/><rect x="700" y="345" width="210" height="135" rx="12" fill="none" stroke="#80d0f5" stroke-width="3"/><text x="745" y="412" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Destination tray</text><path d="M300 425 Q375 485 465 380 Q400 435 315 395 Z" fill="#eab67e"/><text x="290" y="350" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Object pose + grasp center</text><path d="M460 420H685" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="405" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">carry after grasp</text><path d="M200 215V270H390V330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="205" y="260" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">wrist observation</text><path d="M950 215V270H500V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="690" y="260" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">approach</text><rect x="45" y="650" width="330" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Before grasp</text><text x="59" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep object visible</text><text x="59" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Avoid the floor with finger height</text><text x="59" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Align opening and object center</text><rect x="425" y="650" width="330" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">At transition</text><text x="439" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause briefly at pick / place</text><text x="439" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Coordinate grasp and arm motion</text><text x="439" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reject jerky demonstrations</text><rect x="805" y="650" width="330" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">After environment change</text><text x="819" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Viewpoint and occlusion can change</text><text x="819" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Tray location changes the goal</text><text x="819" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Match collection and rollout setup</text></svg>