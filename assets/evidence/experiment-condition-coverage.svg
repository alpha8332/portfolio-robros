ect x="670" y="490" width="135" height="65" rx="4" fill="#18232a" stroke="#47606e"/><text x="725" y="530" fill="#e1eaf0" font-size="24" font-family="Segoe UI,Malgun Gothic,sans-serif">4</text><rect x="825" y="490" width="135" height="65" rx="4" fill="#18232a" stroke="#47606e"/><text x="880" y="530" fill="#e1eaf0" font-size="24" font-family="Segoe UI,Malgun Gothic,sans-serif">4</text><text x="1040" y="530" fill="#80d0f5" font-size="24" font-family="Segoe UI,Malgun Gothic,sans-serif">20</text><text x="40" y="635" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Four orientations per cell: horizontal / vertical / left diagonal / right diagonal</text><text x="40" y="675" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Extra repeats are concentrated in selected conditions; coverage and sampling balance are different questions.</text><text x="40" y="710" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reconstructed from the existing collection worksheet and presentation. Stored episode files were not counted here.</text></svg>