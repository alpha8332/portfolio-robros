<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Banana v3 / planned condition coverage and recorded repetitions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Banana v3 / planned condition coverage and recorded repetitions</text><text x="40" y="85" fill="#e1eaf0" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">4 tray positions × 5 object positions × 4 orientations = 80 base conditions</text><text x="40" y="118" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">The collection table adds 20 repeats: 100 recorded performances. Cell values are counts, not success rates.</text><text x="230" y="190" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Object 1</text><text x="385" y="190" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Object 2</text><text x="540" y="190" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Object 3</text><text x="695" y="190" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Object 4</text><text x="850" y="190" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Object 5</text><text x="1030" y="190" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Total</text><text x="40" y="258" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Tray 1</text><rect x="205" y="220" width="135" height="65" rx="4" fill="#18232a" stroke="#eab67e"/><text x="260" y="260" fill="#eab67e" font-size="24" font-family="Segoe UI,M