<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">KPI1 / one motion reference, two tracking errors and a separate sync metric</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">KPI1 / one motion reference, two tracking errors and a separate sync metric</text><rect x="35" y="75" width="1110" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trial preparation</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Move to start → confirm position → Relative Teleop → repeat the same initial conditions</text><rect x="35" y="210" width="335" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="236" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Circle generator / main loop</text><text x="49" y="262" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">r = 100 mm, T = 5 s, 5 laps</text><text x="49" y="283" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cumulative relative target u(t)</text><text x="49" y="304" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Command scheduler: 60 Hz setting</text><path d="M200 160V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="420" y="195" width="725" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="432" y="220" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONTROLLER / physical response</text><rect x="445" y="240" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Right command → pdes_R</text><text x="459" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SDK call first; internal desired</text><text x="459" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual TCP p_R and orientation</text><rect x="820" y="240" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Left command → pdes_L</text><text x="834" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SDK call second; same target</text><text x="834" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual TCP p_L and orientation</text><path d="M370 260H405V290H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="375" y="245" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">u(t)</text><path d="M405 290V365H790V290H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="385" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">same target; sequential calls</text><rect x="445" y="405" width="675" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Logger / independent thread</text><text x="459" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One state response → both actual and pdes; timestamp, 100 Hz setting</text><path d="M595 340V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 340V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="550" width="345" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-arm tracking</text><text x="49" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_R − pdes_R; p_L − pdes_L</text><text x="49" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Worst-arm RMSE: max(RMSE_R, RMSE_L)</text><text x="49" y="644" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Script diagnostic threshold: 0.1 mm</text><rect x="420" y="550" width="345" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Relative-motion synchronization</text><text x="434" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">(p_R − p_R0) − (p_L − p_L0)</text><text x="434" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Vector norm → RMSE / Mean / Max</text><text x="434" y="644" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Project sync threshold: 1.0 mm</text><rect x="805" y="550" width="340" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Orientation-change comparison</text><text x="819" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial-aligned relative rotvec</text><text x="819" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Right change − Left change</text><text x="819" y="644" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Auxiliary; no rotation commanded</text><path d="M780 470V515H210V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M780 470V515H590V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M780 470V515H975V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="740" width="1110" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="766" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trial files → repeated-trial summary</text><text x="49" y="792" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw state CSV + error time series + trial figures → summary statistics across 20 trials</text><text x="49" y="813" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No fitted mirror / Kabsch transform in this final sync calculation; only the initial translation is removed.</text><path d="M210 670V740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 670V740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M975 670V740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="885" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A 60 Hz request is not proof of a 60 Hz hard real-time loop. Tracking, synchronization and shape fidelity answer different questions.</text></svg>