<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title"><title id="title">얼마나 늦게 따라왔는지 확인하기</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cc4dc" stroke-width="1.4"/></marker></defs><rect width="960" height="360" fill="#14191d"/><g font-family="Malgun Gothic,Pretendard,sans-serif"><text x="24" y="40" font-size="23" fill="#f0f1f2" text-anchor="start">얼마나 늦게 따라왔는지 확인하기</text><text x="24" y="70" font-size="14" fill="#8c979f" text-anchor="start">문제 해결 과정을 요약한 개념도</text><rect x="24" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="42" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">01</text><text x="42" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">실제 움직임 관찰</text><text x="42" y="196" font-size="15" fill="#b0b8be" text-anchor="start">먼저 움직인 팔과</text><text x="42" y="221" font-size="15" fill="#b0b8be" text-anchor="start">따라오는 팔을 기록</text><path d="M237 180L255 180" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="258" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="276" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">02</text><text x="276" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">같은 지점 찾기</text><text x="276" y="196" font-size="15" fill="#b0b8be" text-anchor="start">원궤적의 같은 위상을</text><text x="276" y="221" font-size="15" fill="#b0b8be" text-anchor="start">두 팔에서 대응시킴</text><path d="M471 180L489 180" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="492" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="510" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">03</text><text x="510" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">통과 시각 비교</text><text x="510" y="196" font-size="15" fill="#b0b8be" text-anchor="start">두 팔이 그 지점을</text><text x="510" y="221" font-size="15" fill="#b0b8be" text-anchor="start">언제 지났는지 비교</text><path d="M705 180L723 180" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="726" y="105" width="210" height="150" rx="7" fill="#191e22" stroke="#415362"/><text x="744" y="133" font-size="13" fill="#9cc4dc" text-anchor="start">04</text><text x="744" y="166" font-size="21" fill="#f0f1f2" text-anchor="start">반복 결과 판단</text><text x="744" y="196" font-size="15" fill="#b0b8be" text-anchor="start">20회 평균과</text><text x="744" y="221" font-size="15" fill="#b0b8be" text-anchor="start">기준 초과를 함께 확인</text><text x="24" y="325" font-size="15" fill="#9cc4dc" text-anchor="start">전송 시간 대신 실제 운동을 비교합니다. 실측 파형은 아닙니다.</text></g></svg>