<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">KPI2 / phase landmarks: time difference and residual shape error</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">KPI2 / phase landmarks: time difference and residual shape error</text><rect x="35" y="75" width="500" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual signals / after motion-start crop</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left and Right initial positions removed</text><text x="49" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">For X and Z: percentile 1 / 99 → center and scale</text><text x="49" y="169" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">atan2 → unwrap → direction → monotonic phase</text><rect x="625" y="75" width="520" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Corresponding phase landmarks</text><text x="639" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">X: nπ; Z: π/2 + nπ</text><text x="639" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpolate both crossing times between samples</text><text x="639" y="169" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Omit startup X landmark; exclude unmatched / invalid events</text><path d="M535 135H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="245" width="1110" height="260" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="270" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EXPLANATORY TIMELINE / not a measured trace</text><text x="60" y="310" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Left actual crosses phase φ*</text><text x="60" y="410" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Right actual crosses the same phase φ*</text><path d="M470 325H1090" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M470 425H1090" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M700 285V455M850 285V455" stroke="#eab67e" stroke-dasharray="6 4" fill="none"/><text x="670" y="480" fill="#80d0f5" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">t_L(φ*)</text><text x="820" y="480" fill="#80d0f5" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">t_R(φ*)</text><path d="M700 365H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="715" y="350" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">signed lag = t_R − t_L</text><rect x="35" y="565" width="500" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Temporal result / milliseconds</text><text x="49" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Each landmark: signed lag and absolute lag</text><text x="49" y="638" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Axis max: worst landmark in one trial</text><text x="49" y="659" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Trial judge: worse of X max and Z max</text><text x="49" y="680" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">20-trial mean and pass count reported separately</text><rect x="625" y="565" width="520" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Residual result / millimeters</text><text x="639" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Master X/Z shifted by each axis mean signed lag</text><text x="639" y="638" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">For positive lag, compare Right(t) with Left(t − lag)</text><text x="639" y="659" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Exclude out-of-range interpolation endpoints</text><text x="639" y="680" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Remaining error reflects shape / variable-lag mismatch</text><path d="M1145 135H1165V535H285V565" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M535 642H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="535" y="550" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">mean signed lag →</text><rect x="35" y="775" width="1110" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpretation</text><text x="49" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A small average latency does not imply every trial passes, and time alignment does not make the two paths geometrically identical.</text></svg>