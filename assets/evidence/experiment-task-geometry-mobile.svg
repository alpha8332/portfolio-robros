<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 890" role="img" aria-labelledby="title"><title id="title">보고 · 조작하고 · 결과 확인하기</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cc4dc" stroke-width="1.4"/></marker></defs><rect width="420" height="890" fill="#14191d"/><g font-family="Malgun Gothic,Pretendard,sans-serif"><text x="24" y="40" font-size="23" fill="#f0f1f2" text-anchor="start">보고 · 조작하고 · 결과 확인하기</text><text x="24" y="70" font-size="14" fill="#8c979f" text-anchor="start">문제 해결 과정을 요약한 개념도</text><rect x="30" y="100" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="128" font-size="13" fill="#9cc4dc" text-anchor="start">01</text><text x="48" y="161" font-size="21" fill="#f0f1f2" text-anchor="start">시야를 먼저 확인</text><text x="48" y="191" font-size="15" fill="#b0b8be" text-anchor="start">물체와 트레이가</text><text x="48" y="216" font-size="15" fill="#b0b8be" text-anchor="start">영상에 함께 들어오는가</text><path d="M210 231L210 250" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="255" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="283" font-size="13" fill="#9cc4dc" text-anchor="start">02</text><text x="48" y="316" font-size="21" fill="#f0f1f2" text-anchor="start">한 팔로 교시</text><text x="48" y="346" font-size="15" fill="#b0b8be" text-anchor="start">오른팔은 관측 위치 고정</text><text x="48" y="371" font-size="15" fill="#b0b8be" text-anchor="start">왼팔로 바나나 조작</text><path d="M210 386L210 405" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="410" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="438" font-size="13" fill="#9cc4dc" text-anchor="start">03</text><text x="48" y="471" font-size="21" fill="#f0f1f2" text-anchor="start">작업 순서 연결</text><text x="48" y="501" font-size="15" fill="#b0b8be" text-anchor="start">접근 → 파지 → 이동</text><text x="48" y="526" font-size="15" fill="#b0b8be" text-anchor="start">트레이에 놓기</text><path d="M210 541L210 560" fill="none" stroke="#9cc4dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="565" width="360" height="126" rx="7" fill="#191e22" stroke="#415362"/><text x="48" y="593" font-size="13" fill="#9cc4dc" text-anchor="start">04</text><text x="48" y="626" font-size="21" fill="#f0f1f2" text-anchor="start">시연을 다시 확인</text><text x="48" y="656" font-size="15" fill="#b0b8be" text-anchor="start">가림·파지·동작 끊김을</text><text x="48" y="681" font-size="15" fill="#b0b8be" text-anchor="start">살펴 데이터를 선별</text><text x="24" y="746" font-size="14" fill="#9cc4dc">누리 양팔 · 2지 그리퍼 · 손목 영상 / 배치</text><text x="24" y="768" font-size="14" fill="#9cc4dc">개념도</text></g><g font-family="Malgun Gothic,Pretendard,sans-serif"><rect x="24" y="795" width="372" height="78" rx="5" fill="#1b2932" stroke="#415362"/><text x="40" y="825" font-size="18" fill="#9cc4dc">v1 10회 → v2 50회 → v3 100회</text><text x="40" y="852" font-size="14" fill="#b0b8be">고정 조건에서 위치·자세별 수집으로 확장</text></g></svg>